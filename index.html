<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dépannage Express Bamako — Demande d'intervention</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --success: #15803d;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      color: var(--primary-dark);
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .btn-submit {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert-error {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 11px 13px;
      border-radius: 9px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      display: none;
    }

    .confirmation {
      display: none;
      margin-top: 16px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
    }

    .ref-badge {
      display: inline-block;
      background: #dcfce7;
      color: var(--success);
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .btn-whatsapp {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      background: #16a34a;
      color: #fff;
      font-weight: 700;
      padding: 11px 15px;
      border-radius: 9px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Dépannage Express Bamako</h1>
      <p class="subtitle">Besoin d'un artisan rapidement à Bamako ? Remplis cette demande et confirme sur WhatsApp.</p>

      <div id="error-box" class="alert-error"></div>

      <form id="request-form">
        <div class="field">
          <label for="client_name">Nom complet *</label>
          <input type="text" id="client_name" required placeholder="Ex : Moussa Coulibaly" />
        </div>

        <div class="field">
          <label for="client_phone">Téléphone / WhatsApp *</label>
          <input type="tel" id="client_phone" required placeholder="Ex : +223 70 00 00 00" />
        </div>

        <div class="field">
          <label for="category">Corps de métier / Service *</label>
          <select id="category" required>
            <option value="">-- Choisir un service --</option>
            <option value="Plomberie">Plomberie</option>
            <option value="Électricité">Électricité</option>
            <option value="Climatisation / Froid">Climatisation / Froid</option>
            <option value="Serrurerie / Menuiserie">Serrurerie / Menuiserie</option>
            <option value="Maçonnerie / Peinture">Maçonnerie / Peinture</option>
            <option value="Autre dépannage">Autre dépannage</option>
          </select>
        </div>

        <div class="field">
          <label for="address_details">Quartier & repère précis à Bamako *</label>
          <input type="text" id="address_details" required placeholder="Ex : ACI 2000, près de la pharmacie..." />
        </div>

        <div class="field">
          <label for="description">Description du problème *</label>
          <textarea id="description" required placeholder="Explique brièvement la panne ou le besoin..."></textarea>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">Envoyer la demande</button>
      </form>

      <div id="confirmation-box" class="confirmation">
        <div class="ref-badge" id="conf-ref">DEP-0000</div>
        <div style="font-weight:700; margin-bottom:4px;">Demande enregistrée avec succès !</div>
        <div style="font-size:0.9rem; color:#166534;">
          Clique sur le bouton ci-dessous pour envoyer les détails de ta demande au dispatch sur WhatsApp.
        </div>
        <a id="whatsapp-link" class="btn-whatsapp" href="#" target="_blank" rel="noopener noreferrer">
          Confirmer sur WhatsApp
        </a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ymemjzrztparvxxecjnr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qB_y1f5C285yS57zT_P9_w_zT_P9_w';
    const DISPATCH_WHATSAPP_NUMBER = 'REMPLACE_PAR_TON_NUMERO_WHATSAPP_SANS_PLUS';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('request-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    const confirmationBox = document.getElementById('confirmation-box');
    const confRef = document.getElementById('conf-ref');
    const whatsappLink = document.getElementById('whatsapp-link');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      confirmationBox.style.display = 'none';

      const clientName = document.getElementById('client_name').value.trim();
      const clientPhone = document.getElementById('client_phone').value.trim();
      const category = document.getElementById('category').value;
      const addressDetails = document.getElementById('address_details').value.trim();
      const description = document.getElementById('description').value.trim();

      if (!clientName || !clientPhone || !category || !addressDetails || !description) {
        showError("Merci de remplir tous les champs obligatoires.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Enregistrement en cours...";

      const fullDescription = `[${category}] ${description}`;

      const { data, error } = await sb
        .from('requests')
        .insert([{
          client_name: clientName,
          client_phone: clientPhone,
          address_details: addressDetails,
          description: fullDescription,
          status: 'pending'
        }])
        .select('id, reference_code')
        .single();

      submitBtn.disabled = false;
      submitBtn.textContent = "Envoyer la demande";

      if (error) {
        showError("Impossible d'enregistrer la demande : " + error.message);
        return;
      }

      const refCode = data?.reference_code || data?.id?.slice(0, 8) || 'NOUVELLE';
      confRef.textContent = `Réf : ${refCode}`;

      const cleanPhone = DISPATCH_WHATSAPP_NUMBER.replace(/\D/g, '');
      const message = [
        `Bonjour, nouvelle demande de dépannage (${refCode}) :`,
        `• Client : ${clientName}`,
        `• Téléphone : ${clientPhone}`,
        `• Service : ${category}`,
        `• Lieu : ${addressDetails}`,
        `• Détails : ${description}`
      ].join('\n');

      whatsappLink.href = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
      confirmationBox.style.display = 'block';
      form.reset();
    });
  </script>
</body>
</html>
